name: RIEVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rieva-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Physics, assets, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Run model, asset, and rendered-page checks
        run: npm test

      - name: Run independent Python physics validation
        run: npm run validate:python
